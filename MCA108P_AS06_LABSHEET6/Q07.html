<!doctype html><html lang="en"><meta charset="utf-8"><title>Theme Toggle</title><style>:root{--bg:white;--fg:#222}body{background:var(--bg);color:var(--fg);font:18px Arial}body.dark{--bg:#171717;--fg:#f5f5f5}</style><button id="toggle">Toggle theme</button><h2>Portfolio</h2><script>document.querySelector('#toggle').addEventListener('click',()=>document.body.classList.toggle('dark'));</script></html>

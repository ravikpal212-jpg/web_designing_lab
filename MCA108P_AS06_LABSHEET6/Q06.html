<!doctype html><html lang="en"><meta charset="utf-8"><title>Contact Validation</title><form id="form"><input id="name" placeholder="Name" required><input id="email" type="email" placeholder="Email" required><textarea id="message" placeholder="Message" required></textarea><button>Send</button></form><p id="result"></p><script>document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const n=document.querySelector('#name').value.trim(),m=document.querySelector('#message').value.trim(),em=document.querySelector('#email');document.querySelector('#result').textContent=n&&em.checkValidity()&&m?'Form valid':'Please complete all fields correctly';});</script></html>

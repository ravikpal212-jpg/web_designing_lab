<!doctype html><html lang="en"><meta charset="utf-8"><title>Modal</title><button id="open">Open modal</button><div id="modal" style="display:none;position:fixed;inset:0;background:#0008;place-items:center"><div style="background:white;padding:30px"><button id="close">X</button><p>Hello from modal!</p></div></div><script>const modal=document.querySelector('#modal');document.querySelector('#open').onclick=()=>modal.style.display='grid';document.querySelector('#close').onclick=()=>modal.style.display='none';modal.onclick=e=>{if(e.target===modal)modal.style.display='none'};</script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><title>Testimonials</title><style>#quote{transition:opacity .25s}</style><p id="quote"></p><button id="next">Next</button><script>const quotes=['Great work!','Very professional.','Highly recommended.'];let i=0;const quote=document.querySelector('#quote');function show(){quote.style.opacity=0;setTimeout(()=>{quote.textContent=quotes[i];quote.style.opacity=1},150)}show();document.querySelector('#next').addEventListener('click',()=>{i=(i+1)%quotes.length;show()});</script></html>

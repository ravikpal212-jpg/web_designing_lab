<!doctype html><html lang="en"><meta charset="utf-8"><title>Statistics Counter</title><h2><span class="count" data-target="120">0</span> Projects</h2><h2><span class="count" data-target="45">0</span> Clients</h2><script>const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){const el=e.target,target=+el.dataset.target;let n=0;const id=setInterval(()=>{n=Math.min(n+Math.ceil(target/40),target);el.textContent=n;if(n>=target)clearInterval(id)},30);observer.unobserve(el)}}));document.querySelectorAll('.count').forEach(el=>observer.observe(el));</script></html>

<!DOCTYPE html>
<html>

<head>
    <title>Survey Form</title>
</head>

<body>
    <h2>Survey Form</h2>
    <form>
        <fieldset>
            <legend>Personal Information</legend><label>Name:</label><input type="text"
                name="name"><br><br><label>Email:</label><input type="email" name="email">
        </fieldset><br>
        <fieldset>
            <legend>Survey Details</legend><label>Course:</label><select>
                <option>MCA</option>
                <option>BCA</option>
            </select><br><br><label>Satisfaction:</label><input type="radio" name="s"> Satisfied <input type="radio"
                name="s"> Not Satisfied
        </fieldset><br><input type="submit" value="Submit Survey">
    </form>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Q14 Range</title>
    <link rel="stylesheet" href="Q14.css">
</head>

<body>
    <div class="box">
        <h2>Volume</h2><input type="range" min="0" max="100" value="50" oninput="v.value=this.value"><output
            id="v">50</output> %<br><br><label>Age:</label><input type="number" min="1" max="100"><span> years</span>
    </div>
</body>

</html>

<!DOCTYPE html>
<html><head><title>Q2 Student Registration</title><link rel="stylesheet" href="Q02.css"></head>
<body><form><h2>Student Registration</h2>
<label>Name</label><input type="text" required minlength="3" maxlength="20">
<label>Email</label><input type="email" required>
<label>Mobile</label><input type="text" pattern="[0-9]{10}" required>
<label>Password</label><input type="password" minlength="6" maxlength="15" required>
<label>Age</label><input type="number" required><button>Register</button>
</form></body></html>

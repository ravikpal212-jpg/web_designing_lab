<!DOCTYPE html>
<html>

<head>
    <title>Q1 Form</title>
    <link rel="stylesheet" href="Q01.css">
</head>

<body>
    <form>
        <h2>Registration Form</h2>
        <label>Name:</label><input type="text" placeholder="Enter your name">
        <label>Password:</label><input type="password">
        <label>Gender:</label>
        <div><input type="radio" name="g"> Male <input type="radio" name="g"> Female</div>
        <label>Hobbies:</label>
        <div><input type="checkbox"> Coding <input type="checkbox"> Gaming</div>
        <label>City:</label><select>
            <option>Haridwar</option>
            <option>Delhi</option>
            <option>Dehradun</option>
        </select>
        <label>Message:</label><textarea placeholder="Enter message"></textarea>
        <button>Submit</button>
    </form>
</body>

</html>

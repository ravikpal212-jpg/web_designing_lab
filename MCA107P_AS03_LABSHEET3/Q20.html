<!DOCTYPE html>
<html><head><title>Q20 Dynamic Table</title><style>
table{border-collapse:collapse;margin-top:20px}td,th{border:1px solid #000;padding:10px}
</style></head>
<body><h2>Dynamic Table Generator</h2>
<input id="rows" type="number" placeholder="Rows">
<input id="cols" type="number" placeholder="Columns">
<button onclick="makeTable()">Generate</button>
<div id="table"></div>
<script>
function makeTable(){
 let r=Number(document.getElementById("rows").value);
 let c=Number(document.getElementById("cols").value);
 let table=document.createElement("table");
 for(let i=0;i<r;i++){
  let tr=document.createElement("tr");
  for(let j=0;j<c;j++){
   let td=document.createElement("td");
   td.textContent="Row "+(i+1)+", Col "+(j+1);
   tr.appendChild(td);
  }
  table.appendChild(tr);
 }
 let box=document.getElementById("table");
 box.innerHTML="";
 box.appendChild(table);
}
</script></body></html>

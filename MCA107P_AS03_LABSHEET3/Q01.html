<!DOCTYPE html>
<html>

<head>
    <title>Q1 Arithmetic Operations</title>
</head>

<body>
    <h2>Arithmetic Operations</h2>
    <p>Open the browser console to see the result.</p>
    <script>
        let a = Number(prompt("Enter first number:"));
        let b = Number(prompt("Enter second number:"));
        let result = "Addition: " + (a + b) + "\nSubtraction: " + (a - b) +
            "\nMultiplication: " + (a * b) + "\nDivision: " + (a / b);
        console.log(result);
        alert(result);
    </script>
</body>

</html>
